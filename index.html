<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>Meghívó</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function(){
      emailjs.init("oqwFlauFpkQ_GQZAd");
    })();
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #a8edea, #fed6e3);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    .places button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff7eb3;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .places button:hover {
      background: #ff4f9a;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
    }

    #resultImage {
      display: none;
      max-width: 100%;
      margin-top: 15px;
      border-radius: 10px;
    }

    #countdown {
      margin-bottom: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>💌 Meghívás egy pénteki kalandra</h1>

    <div id="countdown"></div>

    <p>Válaszd ki, hova szeretnél kirándulni:</p>

    <div class="places">
      <button onclick="selectPlace('Szilvásvárad')">Szilvásvárad</button>
      <button onclick="selectPlace('Sátoraljaújhely')">Sátoraljaújhely</button>
      <button onclick="selectPlace('Aggtelek')">Aggtelek</button>
      <button onclick="selectPlace('Boldogkőváralja')">Boldogkőváralja</button>
      <button onclick="selectPlace('Eger')">Eger</button>
      <button onclick="selectPlace('Tokaj')">Tokaj</button>
    </div>

    <div id="result"></div>

    <img id="resultImage" src="dori.jpg" alt="Dóri">
  </div>

<script>
/* ======================
   VISSZASZÁMLÁLÓ
====================== */
function getNextFriday9AM() {
  const now = new Date();
  const result = new Date(now);
  const day = now.getDay();
  const diff = (5 - day + 7) % 7; // 5 = péntek
  result.setDate(now.getDate() + diff);
  result.setHours(9, 0, 0, 0);

  if (result < now) {
    result.setDate(result.getDate() + 7);
  }
  return result;
}

const targetDate = getNextFriday9AM();

function updateCountdown() {
  const now = new Date().getTime();
  const distance = targetDate.getTime() - now;

  if (distance <= 0) {
    document.getElementById("countdown").innerText = "Indulás ideje! 🎒";
    clearInterval(interval);
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((distance / (1000 * 60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById("countdown").innerText =
    `Indulásig hátra: ${days} nap ${hours} óra ${minutes} perc ${seconds} mp`;
}

const interval = setInterval(updateCountdown, 1000);
updateCountdown();

/* ======================
   HELYSZÍNVÁLASZTÁS
====================== */

let hasSelected = false;

function selectPlace(place) {
  if (hasSelected) {
    document.getElementById('result').innerText =
      'Héé, ne csalj! 😄 Már választottál';
    return;
  }

  hasSelected = true;

  document.getElementById('result').innerText =
    'Szuper választás! Pénteken ide megyünk: ' + place + ' ❤️';

  document.getElementById('resultImage').style.display = 'block';

  /* ======================
     EMAIL KÜLDÉS
  ====================== */
  emailjs.send("service_502ze3m", "template_9qn0odf", {
    selected_place: place
  })
  .then(function(response) {
    console.log("Email elküldve!", response.status, response.text);
  }, function(error) {
    console.log("Email hiba:", error);
  });
}
</script>

</body>
</html>
